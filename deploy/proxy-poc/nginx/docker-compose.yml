services:
  # PostgreSQL for Mattermost
  mattermost-db:
    image: ${MM_PG_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MM_SQL_USERNAME}
      POSTGRES_PASSWORD: ${MM_SQL_PASSWORD}
      POSTGRES_DB: ${MM_SQL_DB}
    volumes:
      - mattermost-db-data:/var/lib/postgresql/data
    networks:
      - backend

  # Mattermost Server (not exposed directly, accessed through nginx)
  mattermost:
    image: ${MATTERMOST_IMAGE}
    restart: unless-stopped
    depends_on:
      - mattermost-db
    environment:
      MM_SERVICESETTINGS_SITEURL: ${MM_SITE_URL}
      MM_SQLSETTINGS_DRIVERNAME: ${MM_SQL_DRIVER}
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQL_DRIVER}://${MM_SQL_USERNAME}:${MM_SQL_PASSWORD}@mattermost-db:5432/${MM_SQL_DB}?sslmode=disable&connect_timeout=10
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_FILESETTINGS_DRIVERNAME: local
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
      MM_SERVICESETTINGS_ENABLEINSECUREOUTBOUNDHTTP: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
      MM_PLUGINSETTINGS_AUTOMATICRESTART: "true"
      MM_SERVICESETTINGS_ENABLEAPI: "true"
    volumes:
      - mattermost-config:/mattermost/config:rw
      - mattermost-data:/mattermost/data:rw
      - mattermost-logs:/mattermost/logs:rw
      - ../../../build/plugins:/plugins:rw
    networks:
      - backend
      - frontend

  # PostgreSQL for Keycloak
  keycloak-db:
    image: ${KC_PG_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - backend

  # Keycloak Server (not exposed directly, accessed through nginx)
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    restart: unless-stopped
    depends_on:
      - keycloak-db
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KC_DB_NAME}
      KC_AUTO_BUILD: "true"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_PROXY: edge
    networks:
      backend:
      frontend:
        aliases:
          - keycloak.127.0.0.1.nip.io
    # Expose Keycloak port for direct access (testing purposes)
    ports:
      - "8080:8080"

  # NGINX Reverse Proxy (main entry point)
  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    depends_on:
      - mattermost
    ports:
      - "${PROXY_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mattermost-db-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  keycloak-db-data:
  keycloak-data:
  nginx-logs:
